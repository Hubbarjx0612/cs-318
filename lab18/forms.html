        <h1>Everything Harry Potter</h1>

          <nav>
            <a href="index.html">Home</a>

            <a href="forms.html">Questionaire</a>
        </nav>

<main>
<h2>Harry Potter Questionaire</h2>
<p>Here is a questionaire regarding Harry Potter</p>

<form>
    <label for="first-name">First Name</label>
    <input type="text" id="first-name">
    
    <label for="date">Date</label>
    <input type="date" id="date">

    <label for="email">Email</label>
    <input type="email" id="email">


    <label for="checkbox">Do you like Harry Potter?</label>
    <input type="checkbox" id="checkbox">

    <label for="checkbox1">Have you read the books?</label>
    <input type="checkbox" id="checkbox1">

     <label for="checkbox3">Have you watched the movies?</label>
    <input type="checkbox" id="checkbox3">

    <label for="house">Select your house</label>
    <select id="house">   
    <option value="Gryffindor">Gryffindor</option>                       
    <option value="Hufflepuff">Hufflepuff</option>
    <option value="Ravenclaw">Ravenclaw</option>
    <option value="Slytherin">Slytherin</option>
     </select>

    <input type="submit" id="submit">

</form>

</main>

<footer>
    <p>Harry Potter Trivia by Joy Hubbard</p>
</footer>
